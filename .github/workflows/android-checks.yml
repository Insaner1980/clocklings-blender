name: Android checks

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # Check out the repository to build and validate the application.

jobs:
  check:
    name: Tests, lint and Detekt
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Robolectric's API 37 runtime requires Java 21; app bytecode still targets Java 17.
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-37.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Matches the build, test and standard lint tasks in config/android-check.json.
      - name: Run tests, build and static checks
        run: >-
          bash ./gradlew --no-daemon --no-configuration-cache --continue
          :app:testDebugUnitTest :app:assembleDebug
          :app:ktlintCheck :app:detekt :app:lintDebug
