<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peli, 320 dp leveä näyttö</title>
<!-- Static mockup, 320 x 640 dp. One CSS px equals one dp (sp for font sizes). -->
<style>
@font-face{font-family:'Fredoka';font-weight:500;src:url('../../../../../app/src/main/res/font/fredoka_medium.ttf') format('truetype')}
@font-face{font-family:'Fredoka';font-weight:600;src:url('../../../../../app/src/main/res/font/fredoka_semibold.ttf') format('truetype')}
@font-face{font-family:'Fredoka';font-weight:700;src:url('../../../../../app/src/main/res/font/fredoka_bold.ttf') format('truetype')}
@font-face{font-family:'Nunito';font-weight:600;src:url('../../../../../app/src/main/res/font/nunito_semibold.ttf') format('truetype')}
@font-face{font-family:'Nunito';font-weight:700;src:url('../../../../../app/src/main/res/font/nunito_bold.ttf') format('truetype')}
@font-face{font-family:'Nunito';font-weight:800;src:url('../../../../../app/src/main/res/font/nunito_extrabold.ttf') format('truetype')}
body{margin:0}
a{color:#3A2453;text-decoration:none}
button{font:inherit;color:inherit;border:0;cursor:pointer}
</style>
</head>
<body>
<div style="width: 320px; height: 640px; box-sizing: border-box; padding: 28px 16px 12px; display: flex; flex-direction: column; gap: 8px; background: #FFEAF2; color: #3A2453; font-family: 'Nunito', sans-serif; overflow: hidden">

<header style="height: 48px; display: flex; align-items: center; gap: 10px; flex-shrink: 0">
<button aria-label="Takaisin" style="width: 48px; height: 48px; border-radius: 24px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
</button>
<h1 style="margin: 0; flex-grow: 1; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 22px; line-height: 26px">Tasatunnit</h1>
<button aria-label="Kellon apumerkinnät" aria-pressed="true" style="width: 48px; height: 48px; border-radius: 24px; background: #FFE066; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
</button>
</header>

<div style="display: flex; align-items: center; gap: 10px; flex-shrink: 0">
<div role="progressbar" aria-label="Tehtävä 3 / 10" aria-valuemin="1" aria-valuemax="10" aria-valuenow="3" style="flex-grow: 1; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px">
<span style="height: 8px; border-radius: 4px; background: #6741D9"></span>
<span style="height: 8px; border-radius: 4px; background: #6741D9"></span>
<span style="height: 8px; border-radius: 4px; background: #B197FC"></span>
<span style="height: 8px; border-radius: 4px; background: #F5C2D6"></span>
<span style="height: 8px; border-radius: 4px; background: #F5C2D6"></span>
<span style="height: 8px; border-radius: 4px; background: #F5C2D6"></span>
<span style="height: 8px; border-radius: 4px; background: #F5C2D6"></span>
<span style="height: 8px; border-radius: 4px; background: #F5C2D6"></span>
<span style="height: 8px; border-radius: 4px; background: #F5C2D6"></span>
<span style="height: 8px; border-radius: 4px; background: #F5C2D6"></span>
</div>
<span style="font-weight: 800; font-size: 14px; line-height: 20px">3 / 10</span>
</div>

<div style="display: flex; justify-content: center; flex-shrink: 0">
<div style="position: relative; width: 244px; height: 240px; font-weight: 800; font-size: 11px; line-height: 16px; color: #655279; text-align: center">
<img src="assets/clock-guides-0300.webp" alt="Kello näyttää tasan kolme" style="position: absolute; left: 24px; top: 22px; width: 196px; height: 196px">
<span style="position: absolute; width: 24px; left: 110px; top: 2px">0</span>
<span style="position: absolute; width: 24px; left: 165px; top: 17px">5</span>
<span style="position: absolute; width: 24px; left: 205px; top: 57px">10</span>
<span style="position: absolute; width: 24px; left: 220px; top: 112px">15</span>
<span style="position: absolute; width: 24px; left: 205px; top: 167px">20</span>
<span style="position: absolute; width: 24px; left: 165px; top: 207px">25</span>
<span style="position: absolute; width: 24px; left: 110px; top: 222px">30</span>
<span style="position: absolute; width: 24px; left: 55px; top: 207px">35</span>
<span style="position: absolute; width: 24px; left: 15px; top: 167px">40</span>
<span style="position: absolute; width: 24px; left: 0px; top: 112px">45</span>
<span style="position: absolute; width: 24px; left: 15px; top: 57px">50</span>
<span style="position: absolute; width: 24px; left: 55px; top: 17px">55</span>
</div>
</div>

<section style="box-sizing: border-box; padding: 16px; border-radius: 24px; background: #FFFFFF; display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 22px; line-height: 28px">Mitä kello on?</h2>
<div style="display: flex; flex-direction: column; gap: 8px">
<button style="height: 56px; padding: 0 8px 0 16px; border-radius: 18px; background: #F4EEFB; display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left">
<span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px">Tasan kolme</span>
<span style="height: 40px; min-width: 56px; box-sizing: border-box; padding: 0 10px; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 16px; color: #655279">3.00</span>
</button>
<button style="height: 56px; padding: 0 8px 0 16px; border-radius: 18px; background: #F4EEFB; display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left">
<span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px">Tasan neljä</span>
<span style="height: 40px; min-width: 56px; box-sizing: border-box; padding: 0 10px; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 16px; color: #655279">4.00</span>
</button>
<button style="height: 56px; padding: 0 8px 0 16px; border-radius: 18px; background: #F4EEFB; display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left">
<span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px">Tasan viisi</span>
<span style="height: 40px; min-width: 56px; box-sizing: border-box; padding: 0 10px; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 16px; color: #655279">5.00</span>
</button>
</div>
</section>

</div>
</body>
</html>
