<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oppitunnin sivu</title>
<!-- Static mockup, 412 x 915 dp. One CSS px equals one dp (sp for font sizes). -->
<style>
@font-face{font-family:'Fredoka';font-weight:500;src:url('../../../../../app/src/main/res/font/fredoka_medium.ttf') format('truetype')}
@font-face{font-family:'Fredoka';font-weight:600;src:url('../../../../../app/src/main/res/font/fredoka_semibold.ttf') format('truetype')}
@font-face{font-family:'Fredoka';font-weight:700;src:url('../../../../../app/src/main/res/font/fredoka_bold.ttf') format('truetype')}
@font-face{font-family:'Nunito';font-weight:600;src:url('../../../../../app/src/main/res/font/nunito_semibold.ttf') format('truetype')}
@font-face{font-family:'Nunito';font-weight:700;src:url('../../../../../app/src/main/res/font/nunito_bold.ttf') format('truetype')}
@font-face{font-family:'Nunito';font-weight:800;src:url('../../../../../app/src/main/res/font/nunito_extrabold.ttf') format('truetype')}
body{margin:0}
a{color:#3A2453;text-decoration:none}
button{font:inherit;color:inherit;border:0;cursor:pointer}
</style>
</head>
<body>
<div style="width: 412px; height: 915px; box-sizing: border-box; padding: 40px 16px 24px; display: flex; flex-direction: column; gap: 16px; background: #FFF6D6; color: #3A2453; font-family: 'Nunito', sans-serif; overflow: hidden">

<header style="height: 56px; display: flex; align-items: center; gap: 12px; flex-shrink: 0">
<a href="02-learn-path.html" aria-label="Takaisin" style="width: 48px; height: 48px; border-radius: 24px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
</a>
<h1 style="margin: 0; flex-grow: 1; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 24px; line-height: 28px">Kaksi viisaria</h1>
<span style="height: 36px; padding: 0 14px; border-radius: 18px; background: #FFE8A3; display: flex; align-items: center; font-weight: 800; font-size: 15px">1 / 4</span>
</header>

<div role="progressbar" aria-label="Sivu 1 / 4" aria-valuemin="1" aria-valuemax="4" aria-valuenow="1" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; flex-shrink: 0">
<span style="height: 8px; border-radius: 4px; background: #6741D9"></span>
<span style="height: 8px; border-radius: 4px; background: #F0DB94"></span>
<span style="height: 8px; border-radius: 4px; background: #F0DB94"></span>
<span style="height: 8px; border-radius: 4px; background: #F0DB94"></span>
</div>

<div style="display: flex; justify-content: center; padding: 8px 0; flex-shrink: 0">
<img src="assets/clock-plain-0400.webp" alt="Kello näyttää tasan neljä" style="width: 300px; height: 300px">
</div>

<section style="box-sizing: border-box; padding: 20px; border-radius: 28px; background: #FFFFFF; display: flex; flex-direction: column; gap: 12px">
<p style="margin: 0; font-weight: 700; font-size: 19px; line-height: 28px">Tässä kellossa on kaksi viisaria.</p>
<p style="margin: 0; font-weight: 700; font-size: 19px; line-height: 28px">Lyhyt pinkki viisari on tuntiviisari. Se näyttää, mikä tunti on meneillään.</p>
<div style="display: flex; align-items: center; justify-content: space-between; margin-top: 4px">
<span style="height: 40px; padding: 0 14px 0 12px; border-radius: 20px; background: #FFE3EC; display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 15px">
<span aria-hidden="true" style="width: 26px; height: 8px; border-radius: 4px; background: #E64980"></span>
<span>Tuntiviisari</span>
</span>
<button aria-label="Näytä animaatio uudelleen" style="width: 48px; height: 48px; border-radius: 24px; background: #F1E9FA; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
</button>
</div>
</section>

<div style="flex-grow: 1"></div>

<div style="display: flex; gap: 8px; flex-shrink: 0">
<button disabled style="flex: 1 1 0; height: 64px; border-radius: 32px; background: #F1E9FA; opacity: 0.45; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 20px">Edellinen</button>
<button style="flex: 1.6 1 0; height: 64px; border-radius: 32px; background: #6741D9; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 20px">
<span>Seuraava</span>
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
</button>
</div>

</div>
</body>
</html>
