<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peli, kellon lukeminen</title>
<!-- Static mockup, 412 x 915 dp. One CSS px equals one dp (sp for font sizes). -->
<style>
@font-face{font-family:'Fredoka';font-weight:500;src:url('../../../../../app/src/main/res/font/fredoka_medium.ttf') format('truetype')}
@font-face{font-family:'Fredoka';font-weight:600;src:url('../../../../../app/src/main/res/font/fredoka_semibold.ttf') format('truetype')}
@font-face{font-family:'Fredoka';font-weight:700;src:url('../../../../../app/src/main/res/font/fredoka_bold.ttf') format('truetype')}
@font-face{font-family:'Nunito';font-weight:600;src:url('../../../../../app/src/main/res/font/nunito_semibold.ttf') format('truetype')}
@font-face{font-family:'Nunito';font-weight:700;src:url('../../../../../app/src/main/res/font/nunito_bold.ttf') format('truetype')}
@font-face{font-family:'Nunito';font-weight:800;src:url('../../../../../app/src/main/res/font/nunito_extrabold.ttf') format('truetype')}
body{margin:0}
a{color:#3A2453;text-decoration:none}
button{font:inherit;color:inherit;border:0;cursor:pointer}
</style>
</head>
<body>
<div style="width: 412px; height: 915px; box-sizing: border-box; padding: 40px 16px 24px; display: flex; flex-direction: column; gap: 12px; background: #FFEAF2; color: #3A2453; font-family: 'Nunito', sans-serif; overflow: hidden">

<header style="height: 56px; display: flex; align-items: center; gap: 12px; flex-shrink: 0">
<a href="01-home.html" aria-label="Takaisin" style="width: 48px; height: 48px; border-radius: 24px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
</a>
<h1 style="margin: 0; flex-grow: 1; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 24px; line-height: 28px">Tasatunnit</h1>
<button aria-label="Kellon apumerkinnät" aria-pressed="true" style="width: 48px; height: 48px; border-radius: 24px; background: #FFE066; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
</button>
</header>

<div style="display: flex; align-items: center; gap: 12px; flex-shrink: 0">
<div role="progressbar" aria-label="Tehtävä 3 / 10" aria-valuemin="1" aria-valuemax="10" aria-valuenow="3" style="flex-grow: 1; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px">
<span style="height: 8px; border-radius: 4px; background: #6741D9"></span>
<span style="height: 8px; border-radius: 4px; background: #6741D9"></span>
<span style="height: 8px; border-radius: 4px; background: #B197FC"></span>
<span style="height: 8px; border-radius: 4px; background: #F5C2D6"></span>
<span style="height: 8px; border-radius: 4px; background: #F5C2D6"></span>
<span style="height: 8px; border-radius: 4px; background: #F5C2D6"></span>
<span style="height: 8px; border-radius: 4px; background: #F5C2D6"></span>
<span style="height: 8px; border-radius: 4px; background: #F5C2D6"></span>
<span style="height: 8px; border-radius: 4px; background: #F5C2D6"></span>
<span style="height: 8px; border-radius: 4px; background: #F5C2D6"></span>
</div>
<span style="font-weight: 800; font-size: 15px; line-height: 20px">3 / 10</span>
</div>

<div style="display: flex; justify-content: center; flex-shrink: 0">
<div style="position: relative; width: 344px; height: 344px; font-weight: 800; font-size: 13px; line-height: 20px; color: #655279; text-align: center">
<img src="assets/clock-guides-0300.webp" alt="Kello näyttää tasan kolme" style="position: absolute; left: 30px; top: 30px; width: 284px; height: 284px">
<span style="position: absolute; width: 28px; left: 158px; top: 4px">0</span>
<span style="position: absolute; width: 28px; left: 237px; top: 25px">5</span>
<span style="position: absolute; width: 28px; left: 295px; top: 83px">10</span>
<span style="position: absolute; width: 28px; left: 316px; top: 162px">15</span>
<span style="position: absolute; width: 28px; left: 295px; top: 241px">20</span>
<span style="position: absolute; width: 28px; left: 237px; top: 299px">25</span>
<span style="position: absolute; width: 28px; left: 158px; top: 320px">30</span>
<span style="position: absolute; width: 28px; left: 79px; top: 299px">35</span>
<span style="position: absolute; width: 28px; left: 21px; top: 241px">40</span>
<span style="position: absolute; width: 28px; left: 0px; top: 162px">45</span>
<span style="position: absolute; width: 28px; left: 21px; top: 83px">50</span>
<span style="position: absolute; width: 28px; left: 79px; top: 25px">55</span>
</div>
</div>

<section style="box-sizing: border-box; padding: 20px; border-radius: 28px; background: #FFFFFF; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 26px; line-height: 32px">Mitä kello on?</h2>
<div style="display: flex; flex-direction: column; gap: 10px">
<button style="height: 64px; padding: 0 12px 0 20px; border-radius: 20px; background: #F4EEFB; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left">
<span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 20px">Tasan kolme</span>
<span style="height: 40px; min-width: 64px; box-sizing: border-box; padding: 0 12px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px; color: #655279">3.00</span>
</button>
<button style="height: 64px; padding: 0 12px 0 20px; border-radius: 20px; background: #F4EEFB; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left">
<span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 20px">Tasan neljä</span>
<span style="height: 40px; min-width: 64px; box-sizing: border-box; padding: 0 12px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px; color: #655279">4.00</span>
</button>
<button style="height: 64px; padding: 0 12px 0 20px; border-radius: 20px; background: #F4EEFB; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left">
<span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 20px">Tasan viisi</span>
<span style="height: 40px; min-width: 64px; box-sizing: border-box; padding: 0 12px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px; color: #655279">5.00</span>
</button>
</div>
</section>

</div>
</body>
</html>
