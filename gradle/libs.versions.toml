[versions]
agp = "9.5.2"
kotlin = "2.4.21"
composeBom = "2026.11.01"
activityCompose = "1.13.0"
lifecycle = "2.11.1"
navigation3 = "1.2.2"
datastore = "1.3.0"
kotlinxSerialization = "1.13.0"
coroutines = "1.11.0"
billing = "9.1.0"
junit = "4.13.2"
robolectric = "4.18.1"
jacoco = "0.8.16"
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"
androidxTestEspresso = "3.7.0"
ktlintGradle = "14.2.0"
ktlint = "1.8.0"
detekt = "1.23.8"
owaspDependencyCheck = "13.0.0"
composeStabilityAnalyzer = "0.15.0"
composeRulesDetekt = "0.4.28"
composeRulesKtlint = "0.6.8"
sonarqube = "7.6.0.18749"
benchmark = "1.5.0"

[libraries]
google-play-billing = { module = "com.android.billingclient:billing", version.ref = "billing" }
android-security-lints = { module = "com.android.security.lint:lint", version = "1.0.4" }
compose-rules-detekt = { module = "io.nlopez.compose.rules:detekt", version.ref = "composeRulesDetekt" }
compose-rules-ktlint = { module = "io.nlopez.compose.rules:ktlint", version.ref = "composeRulesKtlint" }
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-text = { group = "androidx.compose.ui", name = "ui-text" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version = "1.2.0" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
guava = { module = "com.google.guava:guava", version = "33.8.0-jre" }
bouncycastle-bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version = "1.87" }
jose4j = { module = "org.bitbucket.b_c:jose4j", version = "0.9.7" }
jdom2 = { module = "org.jdom:jdom2", version = "2.0.6.1" }
jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version = "2.23.0" }
json = { module = "org.json:json", version = "20260814" }
jsoup = { module = "org.jsoup:jsoup", version = "1.24.1" }
logback-classic = { module = "ch.qos.logback:logback-classic", version = "1.6.8" }
moshi = { module = "com.squareup.moshi:moshi", version = "1.15.2" }
wire-runtime = { module = "com.squareup.wire:wire-runtime", version = "7.2.2" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidxTestEspresso" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }

# Version constraints for libraries brought in by the Android runtime dependencies.
androidx-annotation = { module = "androidx.annotation:annotation", version = "1.11.0" }
androidx-annotation-experimental = { module = "androidx.annotation:annotation-experimental", version = "1.6.0" }
androidx-appcompat-resources = { module = "androidx.appcompat:appcompat-resources", version = "1.8.0" }
androidx-autofill = { module = "androidx.autofill:autofill", version = "1.3.0" }
androidx-collection-ktx = { module = "androidx.collection:collection-ktx", version = "1.7.0" }
androidx-concurrent-futures = { module = "androidx.concurrent:concurrent-futures", version = "1.3.0" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version = "1.19.1" }
androidx-customview = { module = "androidx.customview:customview", version = "1.2.0" }
androidx-customview-poolingcontainer = { module = "androidx.customview:customview-poolingcontainer", version = "1.1.0" }
androidx-fragment = { module = "androidx.fragment:fragment", version = "1.9.1" }
androidx-graphics-shapes = { module = "androidx.graphics:graphics-shapes", version = "1.1.0" }
androidx-loader = { module = "androidx.loader:loader", version = "1.2.0" }
androidx-navigationevent-compose = { module = "androidx.navigationevent:navigationevent-compose", version = "1.2.0" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version = "1.4.1" }
androidx-startup-runtime = { module = "androidx.startup:startup-runtime", version = "1.2.0" }
androidx-tracing = { module = "androidx.tracing:tracing", version = "2.0.5" }
androidx-vectordrawable-animated = { module = "androidx.vectordrawable:vectordrawable-animated", version = "1.2.0" }
androidx-versionedparcelable = { module = "androidx.versionedparcelable:versionedparcelable", version = "1.2.1" }
androidx-viewpager = { module = "androidx.viewpager:viewpager", version = "1.1.0" }
androidx-window = { module = "androidx.window:window", version = "1.5.1" }
google-transport-backend-cct = { module = "com.google.android.datatransport:transport-backend-cct", version = "5.0.0" }
google-play-services-base = { module = "com.google.android.gms:play-services-base", version = "18.11.1" }
google-play-services-basement = { module = "com.google.android.gms:play-services-basement", version = "18.12.1" }
google-play-services-location = { module = "com.google.android.gms:play-services-location", version = "21.4.0" }
okio = { module = "com.squareup.okio:okio", version = "3.18.2" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version = "26.1.0" }
kotlinx-atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version = "0.33.0" }
jspecify = { module = "org.jspecify:jspecify", version = "1.0.1" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
owasp-dependency-check = { id = "org.owasp.dependencycheck", version.ref = "owaspDependencyCheck" }
stability-analyzer = { id = "com.github.skydoves.compose.stability.analyzer", version.ref = "composeStabilityAnalyzer" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
